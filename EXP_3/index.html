<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #444;
        }

        /* Main container */
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 25px auto;
        }

        /* ================= HEADER ================= */

        .header {
            background: #55585b;
            color: white;
            padding: 30px 40px 35px;
            border-radius: 0 0 45px 45px;
            text-align: center;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            font-size: 22px;
            font-weight: 600;
        }

        /* ================= FORM AREA ================= */

        .form-container {
            padding: 50px 20px 20px;
        }

        .form-title {
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 38px;
            color: #4c4c4c;
        }

        /* Two-column rows */

        .row {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 35px;
            margin-bottom: 42px;
        }

        .field {
            width: 100%;
        }

        .field label {
            display: block;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #4a4a4a;
        }

        .field input,
        .field select {
            width: 100%;
            height: 60px;
            border: 1px solid #eeeeee;
            border-radius: 5px;
            padding: 0 20px;
            font-size: 18px;
            color: #555;
            outline: none;
            background: #fff;
        }

        .field input::placeholder {
            color: #c7c7c7;
        }

        .field input:focus,
        .field select:focus {
            border-color: #999;
        }

        /* ================= PASSWORD ================= */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 17px;
            cursor: pointer;
            user-select: none;
        }

        /* ================= COURSE ================= */

        .course {
            margin-top: 5px;
            margin-bottom: 50px;
        }

        .course select {
            max-width: 100%;
            appearance: auto;
        }

        /* ================= BUTTON ================= */

        .submit-button {
            width: 100%;
            height: 65px;
            border: none;
            border-radius: 0 0 18px 18px;

            background: #55585b;
            color: white;

            font-size: 23px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .submit-button:hover {
            background: #414345;
        }

        /* ================= MESSAGE ================= */

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 17px;
            display: none;
        }

        .success {
            color: green;
        }

        .error {
            color: #d00000;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 750px) {

            .container {
                width: 95%;
            }

            .header {
                padding: 25px 20px 30px;
            }

            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 17px;
            }

            .form-container {
                padding: 35px 10px 15px;
            }

            .form-title {
                font-size: 25px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 30px;
                margin-bottom: 30px;
            }

            .field label {
                font-size: 19px;
            }

            .field input,
            .field select {
                height: 55px;
                font-size: 16px;
            }

            .submit-button {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>Student Registration</h1>

        <p>
            Create your student account by completing the form below
        </p>

    </div>


    <!-- ================= FORM ================= -->

    <div class="form-container">

        <h2 class="form-title">
            Personal &amp; Account Information
        </h2>

        <form id="registrationForm">

            <!-- Name + Email -->

            <div class="row">

                <div class="field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>

            </div>


            <!-- Mobile + Age -->

            <div class="row">

                <div class="field">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="field">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        max="100"
                        required
                    >

                </div>

            </div>


            <!-- Password + Confirm Password -->

            <div class="row">

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <span
                            class="show-password"
                            onclick="togglePassword()"
                            id="showText"
                        >
                            Show
                        </span>

                    </div>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >

                </div>

            </div>


            <!-- Course -->

            <div class="field course">

                <label for="course">
                    Course
                </label>

                <select id="course" required>

                    <option value="">
                        -- Select your course --
                    </option>

                    <option value="B.Tech IT">
                        B.Tech Information Technology
                    </option>

                    <option value="B.Tech CSE">
                        B.Tech Computer Science Engineering
                    </option>

                    <option value="B.Tech AI">
                        B.Tech Artificial Intelligence
                    </option>

                    <option value="B.Tech ECE">
                        B.Tech Electronics and Communication Engineering
                    </option>

                    <option value="B.Tech EEE">
                        B.Tech Electrical and Electronics Engineering
                    </option>

                    <option value="B.Tech Mechanical">
                        B.Tech Mechanical Engineering
                    </option>

                </select>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="submit-button"
            >
                Create Student Account
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script>

    /* ================= PASSWORD SHOW / HIDE ================= */

    function togglePassword() {

        const password =
            document.getElementById("password");

        const showText =
            document.getElementById("showText");

        if (password.type === "password") {

            password.type = "text";

            showText.textContent = "Hide";

        } else {

            password.type = "password";

            showText.textContent = "Show";
        }
    }


    /* ================= FORM VALIDATION ================= */

    document
        .getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const mobile =
                document.getElementById("mobile").value.trim();

            const age =
                document.getElementById("age").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const course =
                document.getElementById("course").value;

            const message =
                document.getElementById("message");


            /* Mobile validation */

            if (!/^[0-9]{10}$/.test(mobile)) {

                message.style.display = "block";

                message.className = "message error";

                message.textContent =
                    "Please enter a valid 10-digit mobile number.";

                return;
            }


            /* Age validation */

            if (age < 1 || age > 100) {

                message.style.display = "block";

                message.className = "message error";

                message.textContent =
                    "Please enter a valid age.";

                return;
            }


            /* Password validation */

            if (password.length < 6) {

                message.style.display = "block";

                message.className = "message error";

                message.textContent =
                    "Password must contain at least 6 characters.";

                return;
            }


            /* Confirm password */

            if (password !== confirmPassword) {

                message.style.display = "block";

                message.className = "message error";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            /* Course */

            if (course === "") {

                message.style.display = "block";

                message.className = "message error";

                message.textContent =
                    "Please select a course.";

                return;
            }


            /* Success */

            message.style.display = "block";

            message.className = "message success";

            message.textContent =
                "Student account created successfully!";

        });

</script>

</body>
</html>
